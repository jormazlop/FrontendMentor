<div class="grid-header">
  @let icon = `/images/icon-${content().icon}.svg`;
  <img class="icon" [src]="icon" [alt]="content().title" />
  <span class="text-3">{{ content().stat }}</span>
</div>
<div class="grid-footer">
  <span class="text-5">{{ content().title }}</span>
  <span class="text-6 grid-description">{{ content().description }}</span>
</div>
